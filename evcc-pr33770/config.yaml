---
name: evcc (PR 33770 test)
version: 0.316.0-pr33770.1
slug: evcc-pr33770
description: evcc 0.316.0 with the MicroLogic template as it stands in evcc-io/evcc#33770, as a second instance
url: https://github.com/ilian002/evcc/tree/build/pr-33770
stage: experimental

boot: manual
startup: application
init: false
watchdog: http://[HOST]:[PORT:7071]

panel_icon: mdi:flask-outline
panel_admin: false
ingress: true
ingress_port: 7071
webui: http://[HOST]:[PORT:7071]/

host_network: true
legacy: true
homeassistant_api: true

arch:
  - aarch64

map:
  - type: homeassistant_config
    read_only: False

# Informational only: with host_network the ports come from the environment below
ports:
  4713/tcp: 4713
  8888/tcp: 8888

ports_description:
  4713/tcp: "EEBUS (fixed by EVCC_EEBUS_PORT)"
  8888/tcp: "OCPP web socket (fixed by EVCC_OCPP_PORT)"

image: ghcr.io/ilian002/evcc

# Own ports, so it runs next to the production add-on on host networking
environment:
  EVCC_NETWORK_PORT: "7071"
  EVCC_NETWORK_HOST: evcc-pr33770
  EVCC_OCPP_PORT: "8888"
  EVCC_EEBUS_PORT: "4713"

# Own database, so the production add-on's devices are never touched
options:
  sqlite_file: /homeassistant/evcc-pr33770.db

schema:
  sqlite_file: str
